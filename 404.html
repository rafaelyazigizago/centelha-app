<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centelha · página não encontrada</title>
  <!-- Centelha · a página 404 própria (lote 52). O GitHub Pages mostra esta página em qualquer endereço que não existe.
       Os estilos vêm aqui dentro: num endereço errado, um caminho relativo para o estilo.css também não existiria. -->
  <style>
    :root { --fundo: #F8F5EE; --tinta: #1E2420; --suave: #47524C; --acao: #14213D; --acao-tinta: #FFFFFF; --luz: #F5B841; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #0E1626; --tinta: #EEF2F7; --suave: #B8C2D3; --acao: #F5B841; --acao-tinta: #0E1626; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--tinta);
      font: 1.1rem/1.5 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    svg { width: 64px; height: 64px; color: var(--luz); }
    h1 { font-size: 1.7rem; margin: 12px 0 4px; text-wrap: balance; }
    p { color: var(--suave); margin: 0 0 24px; }
    a { display: inline-block; background: var(--acao); color: var(--acao-tinta); text-decoration: none; font-weight: 700; padding: 14px 26px; border-radius: 16px; }
    a:focus-visible { outline: 3px solid var(--luz); outline-offset: 3px; }
  </style>
</head>

    <p>O endereço pode ter um erro de digitação. Suas tarefas estão no lugar de sempre.</p>

  </main>
</body>
